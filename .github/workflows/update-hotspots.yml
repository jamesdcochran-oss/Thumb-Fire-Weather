name: Update Thumb hotspots
on:
  schedule: [{ cron: "*/30 * * * *" }]
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: update-hotspots, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Fails the job (and commits nothing) if every FIRMS feed is down.
      - run: python3 scripts/update_hotspots.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add hotspots.csv hotspots-meta.json
          git diff --cached --quiet && exit 0
          git commit -m "Update hotspots"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push
