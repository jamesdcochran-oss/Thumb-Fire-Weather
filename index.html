<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thumb Fire Weather — Single File</title>
    <link rel="icon" href="data:," />

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
      :root {
        --bg:#f9fafb;
        --card:#ffffff;
        --muted:#6b7280;
        --shadow:0 2px 6px rgba(0,0,0,.08);
        --ok:#16a34a;
        --warn:#d97706;
        --err:#dc2626;
        --neutral:#475569;
      }

      body.dark {
        --bg:#020617;
        --card:#020617;
        --muted:#9ca3af;
        --neutral:#e5e7eb;
        color:#e5e7eb;
      }
      body.dark .legend{background:#111827;color:#e5e7eb}
      body.dark .alerts.info{background:#eff6ff;border-color:#bfdbfe;color:#1e3a8a}
      .alerts{background:#431407;border-color:#9a3412;color:#fed7aa}
      body.dark .badge{ background:#111827; color:var(--neutral); }

      *{box-sizing:border-box}
      html,body{height:100%}
      body{
        margin:0;
        font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
        background:var(--bg);
        color:#0f172a;
      }

      .app-header{
        display:flex;
        align-items:center;
        justify-content:space-between;
        padding:.75rem 1rem;
        background:#1d4ed8;
        color:#fff;
      }

      .app-header h1{margin:0;font-size:1.15rem}
      .statusbar{display:flex;gap:.5rem;align-items:center;justify-content:center;flex-wrap:wrap}
      .quick-links{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
      .badge{
        padding:.25rem .5rem;
        border-radius:999px;
        font-size:.8rem;
        box-shadow:var(--shadow);
        background:#e5e7eb;
        color:var(--neutral);
      }
      .badge.ok{color:#fff;background:var(--ok)}
      .badge.warn{color:#fff;background:var(--warn)}
      .badge.err{color:#fff;background:var(--err)}

      main{display:grid;gap:1rem;padding:1rem}
      .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem}
      .card{background:var(--card);border-radius:12px;padding:.9rem;box-shadow:var(--shadow)}
      .card h3{margin:0 0 .25rem;display:flex;align-items:center;gap:.4rem;font-size:1.05rem}
      .dim{color:var(--muted);font-size:.9rem}
      .metric{margin:.25rem 0}

      .map-wrap{height:480px;border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
      #map{height:100%;width:100%}
      .legend{background:#fff;color:#0f172a;padding:6px 8px;border-radius:8px;box-shadow:var(--shadow)}
      .legend .row{display:flex;align-items:center;gap:6px;margin:4px 0}
      .legend .swatch{width:12px;height:12px;border-radius:50%;display:inline-block}

      .alerts.info{background:#eff6ff;border-color:#bfdbfe;color:#1e3a8a}
      .alerts{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:.75rem;border-radius:8px;box-shadow:var(--shadow)}
      .app-footer{text-align:center;color:var(--muted);padding:.75rem}

      @media (max-width:768px){
        .app-header{flex-direction:column;gap:.75rem;padding:1rem}
        .app-header h1{font-size:1.5rem;text-align:center}
        .quick-links{justify-content:center;width:100%}
        .quick-links .badge{font-size:.75rem;padding:.2rem .4rem}
        main{padding:.75rem;gap:.75rem}
        .cards{grid-template-columns:1fr;gap:.75rem}
        .card{padding:.75rem}
        .map-wrap{height:300px;margin-bottom:1rem}
        .app-footer{padding:.5rem;font-size:.85rem}
        .statusbar .badge{font-size:.7rem;padding:.2rem .4rem}
      }
      @media (min-width:960px){
        main{grid-template-columns:1.2fr 1fr;align-items:start}
        .map-wrap{grid-row:span 2}
      }
    </style>
  </head>
  <body>
    <header class="app-header">
      <h1>🔥 Thumb Fire Weather</h1>
      <div class="quick-links">
        <a href="https://firms.modaps.eosdis.nasa.gov/map/#d:24hrs;@-82.8,43.4,9z" target="_blank" class="badge" style="text-decoration:none">🛰️ FIRMS</a>
        <a href="https://www.weather.gov/dtx/" target="_blank" class="badge" style="text-decoration:none">🌧️ NWS</a>
        <a href="https://www.windy.com/?43.40,-82.80,8" target="_blank" class="badge" style="text-decoration:none">🌪️ Windy</a>
        <button id="themeToggle" class="badge">🌙 Dark</button>
      </div>
    </header>

    <main>
      <section id="cards" class="cards" aria-label="County conditions"></section>
      <section class="map-wrap" aria-label="Hotspots map">
        <div id="map"></div>
      </section>
      <section id="alerts" class="alerts" aria-live="polite" hidden></section>
    </main>

    <footer class="app-footer">
      <div class="statusbar" style="margin-bottom:0.5rem" aria-live="polite">
        <span id="status-noaa" class="badge" title="NOAA Weather API">NOAA ⏳</span>
        <span id="status-firms" class="badge" title="NASA FIRMS dataset (hotspots.csv)">FIRMS ⏳</span>
        <span id="status-tiles" class="badge" title="Map tiles (OSM)">Tiles ⏳</span>
      </div>
      <small id="footer-meta">Data: NOAA NWS & NASA FIRMS · Auto-refresh every 15 minutes</small>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>

    <script>
      // Thumb Fire Weather — Michigan Thumb only (Huron, Sanilac, St. Clair).
      // Weather: api.weather.gov hourly forecast. Hotspots: ./hotspots.csv + ./hotspots-meta.json,
      // generated every 30 min by .github/workflows/update-hotspots.yml.
      const BUILD = "2026-10-22";
      const CONFIG = {
        BUFFER_KM: 30,
        REFRESH_MS: 15 * 60 * 1000,
        STALE_HOURS: 3,          // dataset older than this => "stale"
        CSV_URL: "./hotspots.csv",
        META_URL: "./hotspots-meta.json",
      };
      const COUNTIES = [
        { name: "Huron", lat: 43.868, lon: -83.040 },
        { name: "Sanilac", lat: 43.423, lon: -82.820 },
        { name: "St. Clair", lat: 42.930, lon: -82.680 },
      ];
      // Browsers forbid setting User-Agent from fetch; NWS accepts the request without it.
      const NOAA_HEADERS = { Accept: "application/geo+json" };

      let map, layers = {};
      const countyBuffers = new Map();
      const pointsUrlCache = new Map();
      let lastGoodHotspots = null;   // { geojson, meta, loadedAt }
      let refreshing = false;

      const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
      const fmtTime = (d) => d ? d.toLocaleString([], { dateStyle: "short", timeStyle: "short" }) : "unknown";

      function setBadge(id, state, label, title){
        const el = document.getElementById(id);
        if (!el) return;
        el.classList.remove("ok","warn","err");
        if (state) el.classList.add(state);
        if (label) el.textContent = label;
        if (title) el.title = title;
      }

      function setAlerts(messages){
        const box = document.getElementById("alerts");
        if (!box) return;
        box.hidden = messages.length === 0;
        box.innerHTML = messages.map(m => `<div>${esc(m)}</div>`).join("");
      }

      function getCountyBuffer(county){
        if (!countyBuffers.has(county.name)) {
          countyBuffers.set(county.name, turf.circle([county.lon, county.lat], CONFIG.BUFFER_KM, { units: "kilometers", steps: 64 }));
        }
        return countyBuffers.get(county.name);
      }

      // ---------- Map ----------
      function initMap(){
        map = L.map("map");
        const tiles = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 18, attribution: "© OpenStreetMap contributors"
        });
        tiles.on("load", () => setBadge("status-tiles","ok","Tiles ✅"));
        tiles.on("tileerror", () => setBadge("status-tiles","warn","Tiles ⚠️"));
        tiles.addTo(map);

        L.control.scale({ metric: false }).addTo(map);
        layers.hotspots = L.layerGroup().addTo(map);
        layers.buffers = L.layerGroup().addTo(map);
        layers.centers = L.layerGroup().addTo(map);
        L.control.layers({}, {
          "🔥 Satellite detections": layers.hotspots,
          [`🟢 Buffers (${CONFIG.BUFFER_KM} km)`]: layers.buffers,
          "📍 County reference points": layers.centers
        }, { collapsed: true }).addTo(map);

        const legend = L.control({ position: "bottomright" });
        legend.onAdd = () => {
          const div = L.DomUtil.create("div","legend");
          div.innerHTML = `
            <div class="row"><span class="swatch" style="background:#ef4444"></span>Satellite detection (24 h)</div>
            <div class="row"><span class="swatch" style="background:#22c55e"></span>${CONFIG.BUFFER_KM} km buffer</div>
            <div class="row"><span class="swatch" style="background:#0ea5e9"></span>County reference point</div>`;
          return div;
        };
        legend.addTo(map);
        drawBuffersAndCenters();
      }

      function drawBuffersAndCenters(){
        const circles = COUNTIES.map(c => {
          const circle = getCountyBuffer(c);
          L.geoJSON(circle, { style: { color:"#22c55e", weight:1, fillOpacity:0.08 } }).addTo(layers.buffers);
          L.circleMarker([c.lat, c.lon], { radius:5, color:"#0ea5e9", fillColor:"#0ea5e9", fillOpacity:.9 })
            .bindTooltip(c.name).addTo(layers.centers);
          return circle;
        });
        const b = turf.bbox(turf.featureCollection(circles));
        map.fitBounds([[b[1], b[0]], [b[3], b[2]]], { padding: [30,30] });
      }

      function drawHotspots(geojson){
        layers.hotspots.clearLayers();
        if (!geojson?.features?.length) return;
        L.geoJSON(geojson, {
          pointToLayer: (f, latlng) => {
            const p = f.properties || {};
            const t = String(p.acq_time ?? "").replace(/\D/g, "").padStart(4, "0").slice(-4);
            const observed = p.acq_date ? `${p.acq_date} ${t.slice(0,2)}:${t.slice(2)} UTC` : "unknown";
            return L.circleMarker(latlng, { radius:4, color:"#ef4444", fillColor:"#ef4444", fillOpacity:.85, weight:1 })
              .bindPopup(`<strong>🔥 Satellite heat detection</strong><br>Observed: ${esc(observed)}<br>` +
                         `${esc(p.feed || p.instrument || "VIIRS")}${p.confidence ? " • confidence: " + esc(p.confidence) : ""}` +
                         `${p.frp ? "<br>FRP: " + esc(p.frp) + " MW" : ""}`);
          }
        }).addTo(layers.hotspots);
      }

      // ---------- CSV ----------
      function parseCsvLine(line){
        const out = []; let cur = "", q = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (ch === '"') { if (q && line[i+1] === '"') { cur += '"'; i++; } else q = !q; }
          else if (ch === "," && !q) { out.push(cur); cur = ""; }
          else cur += ch;
        }
        out.push(cur);
        return out.map(s => s.trim());
      }

      // Throws on malformed input; returns [] only for a valid header-only file.
      function parseHotspotCsv(text){
        const lines = String(text || "").replace(/^\uFEFF/, "").split(/\r?\n/).filter(l => l.trim());
        if (!lines.length) throw new Error("hotspots.csv is empty");
        const headers = parseCsvLine(lines[0]);
        if (!headers.includes("latitude") || !headers.includes("longitude")) throw new Error("hotspots.csv missing latitude/longitude header");
        const features = [];
        let rejected = 0;
        for (const line of lines.slice(1)) {
          const cols = parseCsvLine(line);
          const row = {}; headers.forEach((h, i) => row[h] = cols[i] ?? "");
          const lat = row.latitude === "" ? NaN : Number(row.latitude);
          const lon = row.longitude === "" ? NaN : Number(row.longitude);
          if (!Number.isFinite(lat) || !Number.isFinite(lon) || Math.abs(lat) > 90 || Math.abs(lon) > 180) { rejected++; continue; }
          features.push({ type: "Feature", geometry: { type: "Point", coordinates: [lon, lat] }, properties: row });
        }
        return { geojson: { type: "FeatureCollection", features }, rejected };
      }

      async function fetchHotspots(){
        const bust = `?t=${Date.now()}`;
        const [csvRes, metaRes] = await Promise.allSettled([
          fetch(CONFIG.CSV_URL + bust, { cache: "no-store" }),
          fetch(CONFIG.META_URL + bust, { cache: "no-store" }),
        ]);
        if (csvRes.status !== "fulfilled" || !csvRes.value.ok) {
          throw new Error(`hotspots.csv unavailable (${csvRes.value?.status ?? csvRes.reason?.message ?? "network error"})`);
        }
        const { geojson, rejected } = parseHotspotCsv(await csvRes.value.text());
        let meta = null;
        if (metaRes.status === "fulfilled" && metaRes.value.ok) {
          try { meta = await metaRes.value.json(); } catch (_) { meta = null; }
        }
        return { geojson, meta, rejected, loadedAt: new Date() };
      }

      // ---------- NOAA ----------
      async function fetchJson(url){
        const r = await fetch(url, { headers: NOAA_HEADERS });
        if (!r.ok) throw new Error(`${r.status} ${url}`);
        return r.json();
      }

      async function fetchNOAAHourly(county){
        let hourlyUrl = pointsUrlCache.get(county.name);
        if (!hourlyUrl) {
          const meta = await fetchJson(`https://api.weather.gov/points/${county.lat},${county.lon}`);
          hourlyUrl = meta?.properties?.forecastHourly;
          if (!hourlyUrl) throw new Error("missing forecastHourly");
          pointsUrlCache.set(county.name, hourlyUrl);
        }
        const hourly = await fetchJson(hourlyUrl);
        const periods = hourly?.properties?.periods || [];
        const now = Date.now();
        // Pick the period covering "now" (first period can already be in the past).
        const p = periods.find(x => new Date(x.endTime).getTime() > now) || periods[0];
        if (!p) throw new Error("no forecast periods");
        return p;
      }

      // ---------- Rendering ----------
      function renderCards(results, hotspotsAvailable, stale){
        const cards = document.getElementById("cards");
        cards.innerHTML = results.map(({ county, wx, wxErr, count }) => {
          const label = wx?.shortForecast ?? "N/A";
          const icon = /thunder/i.test(label) ? "⛈️" : /rain|shower/i.test(label) ? "🌧️" : /snow/i.test(label) ? "🌨️" : "🌤️";
          const wxLine = wx
            ? `${esc(wx.temperature)}°${esc(wx.temperatureUnit || "F")} • ${esc(wx.relativeHumidity?.value ?? "N/A")}% RH • ${esc(wx.windSpeed ?? "N/A")} ${esc(wx.windDirection ?? "")}`
            : `Unavailable${wxErr ? ` <span class="dim">(${esc(wxErr)})</span>` : ""}`;
          const validAt = wx ? `<div class="dim">Valid ${esc(fmtTime(new Date(wx.startTime)))}</div>` : "";
          const hs = hotspotsAvailable ? `<strong>${count}</strong>${stale ? ' <span class="dim">(stale)</span>' : ""}` : "<strong>N/A</strong>";
          return `<article class="card" data-county="${esc(county.name)}">
              <h3>${icon} ${esc(county.name)} County</h3>
              <div class="dim">${esc(label)}</div>
              <div class="metric">Hourly forecast: ${wxLine}</div>${validAt}
              <div class="metric">Satellite detections ≤ ${CONFIG.BUFFER_KM} km (24 h): ${hs}</div>
            </article>`;
        }).join("");
      }

      function renderFooter(h){
        const el = document.getElementById("footer-meta");
        const gen = h?.meta?.generated_at ? fmtTime(new Date(h.meta.generated_at)) : "unknown";
        const latest = h?.meta?.latest_observation || "none in window";
        el.textContent = `Data: NOAA NWS hourly forecast & NASA FIRMS VIIRS · Dataset generated: ${gen} · Latest detection: ${latest} · ` +
                         `Page loaded: ${fmtTime(new Date())} · Auto-refresh every ${CONFIG.REFRESH_MS / 60000} min · Build ${BUILD}`;
      }

      async function refresh(){
        if (refreshing) return;
        refreshing = true;
        const warnings = [];
        try {
          // Hotspots
          let h = null;
          try {
            h = await fetchHotspots();
            lastGoodHotspots = h;
          } catch (e) {
            console.warn("Hotspots:", e);
            warnings.push(`Hotspot data could not be loaded: ${e.message}.` + (lastGoodHotspots ? " Showing last good dataset." : ""));
            h = lastGoodHotspots;
          }

          let stale = false;
          if (!h) {
            setBadge("status-firms","err","FIRMS ❌","No valid hotspot dataset");
          } else {
            const genAt = h.meta?.generated_at ? new Date(h.meta.generated_at) : null;
            const ageH = genAt ? (Date.now() - genAt.getTime()) / 3.6e6 : Infinity;
            stale = ageH > CONFIG.STALE_HOURS;
            const failed = Object.keys(h.meta?.feeds_failed || {});
            if (stale) {
              setBadge("status-firms","warn","FIRMS ⚠️ stale", genAt ? `Dataset generated ${fmtTime(genAt)}` : "Dataset age unknown");
              warnings.push(genAt
                ? `Hotspot dataset is ${ageH.toFixed(1)} h old (generated ${fmtTime(genAt)}). Check the update-hotspots workflow.`
                : "Hotspot dataset age is unknown (hotspots-meta.json missing).");
            } else if (failed.length) {
              setBadge("status-firms","warn","FIRMS ⚠️ partial", `Failed feeds: ${failed.join(", ")}`);
              warnings.push(`Partial satellite coverage — failed feeds: ${failed.join(", ")}.`);
            } else {
              setBadge("status-firms","ok","FIRMS ✅", `Dataset generated ${fmtTime(genAt)}`);
            }
            if (h.rejected) warnings.push(`${h.rejected} hotspot row(s) had invalid coordinates and were skipped.`);
            drawHotspots(h.geojson);
          }

          // Weather (all counties settle before status is set)
          const features = h?.geojson?.features || [];
          const results = await Promise.all(COUNTIES.map(async county => {
            let wx = null, wxErr = null;
            try { wx = await fetchNOAAHourly(county); }
            catch (e) { wxErr = e.message; pointsUrlCache.delete(county.name); console.warn("NOAA", county.name, e); }
            const buf = getCountyBuffer(county);
            const count = features.filter(f => turf.booleanPointInPolygon(f.geometry.coordinates, buf)).length;
            return { county, wx, wxErr, count };
          }));
          const okWx = results.filter(r => r.wx).length;
          if (okWx === COUNTIES.length) setBadge("status-noaa","ok","NOAA ✅");
          else if (okWx > 0) {
            setBadge("status-noaa","warn",`NOAA ⚠️ ${okWx}/${COUNTIES.length}`);
            warnings.push(`NOAA forecast unavailable for: ${results.filter(r => !r.wx).map(r => r.county.name).join(", ")}.`);
          } else {
            setBadge("status-noaa","err","NOAA ❌");
            warnings.push("NOAA forecasts unavailable for all counties.");
          }

          renderCards(results, !!h, stale);
          renderFooter(h);

          const rendered = [...document.querySelectorAll("#cards .card")].map(c => c.dataset.county);
          const missing = COUNTIES.map(c => c.name).filter(n => !rendered.includes(n));
          if (missing.length) warnings.unshift(`Self-check failed: ${missing.join(", ")} not rendered.`);
        } catch (e) {
          console.error("Refresh failed", e);
          warnings.unshift(`Refresh failed: ${e.message}. Previous data left in place.`);
        } finally {
          setAlerts(warnings);
          refreshing = false;
        }
      }

      window.addEventListener("DOMContentLoaded", () => {
        initMap();
        refresh();
        setInterval(refresh, CONFIG.REFRESH_MS);
        document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
      });
    </script>

    <script>
      const toggle = document.getElementById("themeToggle");
      if (toggle) {
        toggle.addEventListener("click", () => {
          document.body.classList.toggle("dark");
          toggle.textContent = document.body.classList.contains("dark") ? "☀️ Light" : "🌙 Dark";
        });
      }
    </script>
  </body>
</html>
